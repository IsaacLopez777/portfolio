<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hangman - English Practice</title>
  <style>
    /* ============================================
       CSS VARIABLES - Edit colors here
       ============================================ */
    :root {
      --bg-primary: #0f172a;      /* Navy background */
      --bg-secondary: #1e293b;     /* Slightly lighter navy */
      --bg-card: #334155;         /* Card background */
      --text-primary: #ffffff;     /* White text */
      --text-secondary: #94a3b8;   /* Gray text */
      --accent: #f97316;          /* Orange - buttons, correct */
      --accent-hover: #ea580c;    /* Orange darker */
      --error: #ef4444;          /* Red for errors */
      --error-light: #7f1d1d;     /* Soft red background */
      --success: #22c55e;         /* Green for wins */
      --border: #475569;          /* Border color */
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* ============================================
       HEADER & CONTROLS
       ============================================ */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--accent), #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .scoreboard {
      display: flex;
      gap: 24px;
      justify-content: center;
      margin-bottom: 16px;
    }

    .score-item {
      background: var(--bg-secondary);
      padding: 12px 20px;
      border-radius: 12px;
      text-align: center;
      min-width: 80px;
      border: 1px solid var(--border);
    }

    .score-item .label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .score-item .value {
      font-size: 1.75rem;
      font-weight: 700;
    }

    .score-item.wins .value { color: var(--success); }
    .score-item.losses .value { color: var(--error); }
    .score-item.streak .value { color: var(--accent); }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 24px;
    }

    select, button {
      font-family: inherit;
      font-size: 0.9rem;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    select {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    select:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button {
      background: var(--accent);
      color: white;
      font-weight: 600;
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ============================================
       GAME AREA
       ============================================ */
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 600px;
    }

    .category-badge {
      background: var(--bg-secondary);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 16px;
      border: 1px solid var(--accent);
    }

    /* HANGMAN SVG */
    .hangman-svg {
      width: 200px;
      height: 220px;
      margin-bottom: 20px;
    }

    .hangman-svg .structure {
      stroke: var(--text-secondary);
      stroke-width: 4;
      stroke-linecap: round;
    }

    .hangman-svg .body-part {
      stroke: var(--accent);
      stroke-width: 4;
      stroke-linecap: round;
      fill: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .hangman-svg .body-part.visible {
      opacity: 1;
    }

    .hangman-svg .head {
      fill: none;
    }

    /* WORD DISPLAY */
    .word-display {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 20px;
    }

    .letter-slot {
      width: 40px;
      height: 50px;
      border-bottom: 3px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 700;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .letter-slot.space {
      border-bottom: none;
      width: 20px;
    }

    .letter-slot.revealed {
      color: var(--text-primary);
      border-color: var(--success);
      animation: revealLetter 0.3s ease;
    }

    @keyframes revealLetter {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* HINT */
    .hint-box {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 24px;
      max-width: 100%;
    }

    .hint-box .hint-label {
      font-size: 0.7rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }

    .hint-box .hint-text {
      font-size: 1rem;
      font-style: italic;
      color: var(--text-primary);
    }

    /* MESSAGE */
    .message {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 16px;
      padding: 12px 24px;
      border-radius: 8px;
      text-align: center;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
    }

    .message.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .message.won {
      background: var(--success);
      color: white;
    }

    .message.lost {
      background: var(--error);
      color: white;
    }

    /* ============================================
       KEYBOARD
       ============================================ */
    .keyboard {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      max-width: 500px;
      margin-bottom: 20px;
    }

    .key {
      width: 42px;
      height: 50px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      text-transform: uppercase;
    }

    .key:hover:not(:disabled) {
      background: var(--bg-card);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .key:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .key:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .key.correct {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .key.wrong {
      background: var(--error-light);
      border-color: var(--error);
      color: var(--error);
    }

    /* ============================================
       CONFETTI
       ============================================ */
    .confetti-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1000;
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      opacity: 0;
    }

    @keyframes confettiFall {
      0% {
        opacity: 1;
        transform: translateY(-100px) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(100vh) rotate(720deg);
      }
    }

    /* ============================================
       RESPONSIVE
       ============================================ */
    @media (max-width: 500px) {
      .header h1 { font-size: 1.8rem; }
      .scoreboard { gap: 12px; }
      .score-item { padding: 8px 12px; min-width: 60px; }
      .score-item .value { font-size: 1.3rem; }
      .key { width: 32px; height: 42px; font-size: 0.9rem; }
      .letter-slot { width: 28px; height: 40px; font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <!-- ============================================
       STRUCTURE - No need to edit below unless customizing
       ============================================ -->

  <header class="header">
    <h1>Hangman</h1>
    <div class="scoreboard">
      <div class="score-item wins">
        <div class="label">Wins</div>
        <div class="value" id="wins">0</div>
      </div>
      <div class="score-item losses">
        <div class="label">Losses</div>
        <div class="value" id="losses">0</div>
      </div>
      <div class="score-item streak">
        <div class="label">Streak</div>
        <div class="value" id="streak">0</div>
      </div>
    </div>
    <div class="controls">
      <!-- Category selector -->
      <select id="category-select" aria-label="Select category">
        <option value="all">All Categories</option>
      </select>
      <!-- New word button -->
      <button id="new-game-btn" aria-label="Start new game">New Word</button>
    </div>
  </header>

  <main class="game-container">
    <div class="category-badge" id="category-badge">Category</div>

    <!-- Hangman SVG -->
    <svg class="hangman-svg" viewBox="0 0 200 220" aria-hidden="true">
      <!-- Gallows - always visible -->
      <line class="structure" x1="20" y1="210" x2="100" y2="210" />
      <line class="structure" x1="60" y1="210" x2="60" y2="20" />
      <line class="structure" x1="60" y1="20" x2="130" y2="20" />
      <line class="structure" x1="130" y1="20" x2="130" y2="40" />
      <!-- Head -->
      <circle class="body-part head" id="head" cx="130" cy="55" r="15" />
      <!-- Body -->
      <line class="body-part" id="body" x1="130" y1="70" x2="130" y2="120" />
      <!-- Left Arm -->
      <line class="body-part" id="leftArm" x1="130" y1="85" x2="105" y2="105" />
      <!-- Right Arm -->
      <line class="body-part" id="rightArm" x1="130" y1="85" x2="155" y2="105" />
      <!-- Left Leg -->
      <line class="body-part" id="leftLeg" x1="130" y1="120" x2="105" y2="160" />
      <!-- Right Leg -->
      <line class="body-part" id="rightLeg" x1="130" y1="120" x2="155" y2="160" />
    </svg>

    <!-- Word display -->
    <div class="word-display" id="word-display" aria-label="Word to guess"></div>

    <!-- Hint box -->
    <div class="hint-box">
      <div class="hint-label">Hint</div>
      <div class="hint-text" id="hint-text">Press a letter to start...</div>
    </div>

    <!-- Message -->
    <div class="message" id="message" role="alert"></div>

    <!-- Keyboard -->
    <div class="keyboard" id="keyboard" role="group" aria-label="Letter keyboard"></div>
  </main>

  <!-- Confetti container -->
  <div class="confetti-container" id="confetti-container"></div>

  <script>
    /* ============================================
       WORD BANK - Edit this array to add/change words
       Each entry: { word: "WORD", hint: "English hint description", category: "Category Name" }
       ============================================ */
    const WORD_BANK = [
      // Future "will"
      { word: "WILL", hint: "We use it to talk about the future: 'I ___ travel tomorrow.'", category: "Future 'will'" },
      { word: "TOMORROW", hint: "Time reference with 'will': 'I will see you ___.'", category: "Future 'will'" },
      { word: "PREDICT", hint: "Verb used with 'will' to say what you think: 'I ___ it will rain.'", category: "Future 'will'" },
      { word: "PROMISE", hint: "When you say you will definitely do something: 'I ___ to be there.'", category: "Future 'will'" },

      // Future "going to"
      { word: "GOING", hint: "Part of '___ to' for planned futures: 'I am ___ to study.'", category: "Future 'going to'" },
      { word: "PLAN", hint: "You have a plan, so you're '___ to' do something.", category: "Future 'going to'" },
      { word: "INTEND", hint: "When you have an intention: 'I ___ to learn English.'", category: "Future 'going to'" },

      // Verb to be
      { word: "AM", hint: "Verb to be for 'I': 'I ___ a student.'", category: "Verb to be" },
      { word: "IS", hint: "Verb to be for 'he/she/it': 'She ___ beautiful.'", category: "Verb to be" },
      { word: "ARE", hint: "Verb to be for 'you/we/they': 'You ___ welcome.'", category: "Verb to be" },
      { word: "WAS", hint: "Past of 'to be' for 'I/he/she/it': 'He ___ tired.'", category: "Verb to be" },
      { word: "WERE", hint: "Past of 'to be' for 'you/we/they': 'They ___ happy.'", category: "Verb to be" },

      // Present continuous
      { word: "PLAYING", hint: "Action happening now: 'I am ___ video games.'", category: "Present continuous" },
      { word: "STUDYING", hint: "You are doing it right now: 'She is ___ for her exam.'", category: "Present continuous" },
      { word: "WORKING", hint: "Present action: 'They are ___ on a project.'", category: "Present continuous" },
      { word: "LISTENING", hint: "Now you hear: 'I am ___ to music.'", category: "Present continuous" },
      { word: "WATCHING", hint: "Looking at something: 'We are ___ a movie.'", category: "Present continuous" },

      // Past simple
      { word: "WAS", hint: "Past of 'to be' for singular: 'It ___ a good day.'", category: "Past simple" },
      { word: "WERE", hint: "Past of 'to be' for plural: 'You ___ right.'", category: "Past simple" },
      { word: "YESTERDAY", hint: "Past time word: 'I saw her ___.'", category: "Past simple" },
      { word: "BEFORE", hint: "Earlier than now: 'Call me ___ you leave.'", category: "Past simple" },
      { word: "LAST", hint: "Use with night/week/month: 'I went there ___ night.'", category: "Past simple" },

      // Present simple
      { word: "WORK", hint: "Routine: 'I ___ in technology.'", category: "Present simple" },
      { word: "LIVE", hint: "Where you reside: 'I ___ in Costa Rica.'", category: "Present simple" },
      { word: "LIKE", hint: "Enjoy something: 'I ___ programming.'", category: "Present simple" },
      { word: "SPEAK", hint: "Use your voice: 'I can ___ three languages.'", category: "Present simple" },
      { word: "EVERY DAY", hint: "Routine expression: 'I drink coffee ___.'", category: "Present simple" },

      // Vocabulary - personal
      { word: "ENGINEER", hint: "A person who designs systems or software.", category: "Vocabulary" },
      { word: "SOFTWARE", hint: "Programs that run on a computer.", category: "Vocabulary" },
      { word: "COSTA RICA", hint: "A beautiful country in Central America.", category: "Vocabulary" },
      { word: "GYM", hint: "Place where you exercise.", category: "Vocabulary" },
      { word: "MUSIC", hint: "Something you listen to for enjoyment.", category: "Vocabulary" },
      { word: "ANIME", hint: "Japanese animated shows or movies.", category: "Vocabulary" },
      { word: "ROCK", hint: "Music genre or type of stone.", category: "Vocabulary" },
      { word: "HOBBY", hint: "Something you enjoy doing in free time.", category: "Vocabulary" },
      { word: "FRIEND", hint: "A person you know and trust.", category: "Vocabulary" },
      { word: "QUESTION", hint: "You ask this when you want an answer.", category: "Vocabulary" }
    ];

    /* ============================================
       GAME STATE
       ============================================ */
    let currentWord = '';
    let currentHint = '';
    let currentCategory = '';
    let guessedLetters = new Set();
    let wrongGuesses = 0;
    let maxWrongGuesses = 6;
    let score = { wins: 0, losses: 0, streak: 0 };
    let gameOver = false;

    // DOM Elements
    const wordDisplay = document.getElementById('word-display');
    const hintText = document.getElementById('hint-text');
    const categoryBadge = document.getElementById('category-badge');
    const keyboard = document.getElementById('keyboard');
    const message = document.getElementById('message');
    const winsEl = document.getElementById('wins');
    const lossesEl = document.getElementById('losses');
    const streakEl = document.getElementById('streak');
    const categorySelect = document.getElementById('category-select');
    const newGameBtn = document.getElementById('new-game-btn');
    const confettiContainer = document.getElementById('confetti-container');

    // Body parts in order of appearance
    const bodyParts = ['head', 'body', 'leftArm', 'rightArm', 'leftLeg', 'rightLeg'];

    /* ============================================
       INITIALIZATION
       ============================================ */
    function init() {
      populateCategorySelect();
      createKeyboard();
      loadScore();
      startNewGame();

      // Event listeners
      newGameBtn.addEventListener('click', startNewGame);
      categorySelect.addEventListener('change', startNewGame);
      document.addEventListener('keydown', handlePhysicalKeyboard);
    }

    /* ============================================
       CATEGORY SELECTOR
       ============================================ */
    function populateCategorySelect() {
      const categories = [...new Set(WORD_BANK.map(w => w.category))];
      categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        categorySelect.appendChild(option);
      });
    }

    /* ============================================
       ON-SCREEN KEYBOARD
       ============================================ */
    function createKeyboard() {
      const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ '.split('');
      keyboard.innerHTML = '';

      letters.forEach(letter => {
        const key = document.createElement('button');
        key.className = 'key';
        key.textContent = letter === ' ' ? '␣' : letter;
        key.dataset.letter = letter === ' ' ? ' ' : letter;
        key.setAttribute('aria-label', letter === ' ' ? 'Space' : letter);
        key.addEventListener('click', () => handleGuess(letter));
        keyboard.appendChild(key);
      });
    }

    /* ============================================
       START NEW GAME
       ============================================ */
    function startNewGame() {
      const selectedCategory = categorySelect.value;

      // Filter words by category
      const availableWords = selectedCategory === 'all'
        ? WORD_BANK
        : WORD_BANK.filter(w => w.category === selectedCategory);

      // Pick random word
      const randomEntry = availableWords[Math.floor(Math.random() * availableWords.length)];
      currentWord = randomEntry.word;
      currentHint = randomEntry.hint;
      currentCategory = randomEntry.category;

      // Reset state
      guessedLetters.clear();
      wrongGuesses = 0;
      gameOver = false;

      // Reset UI
      hideMessage();
      resetKeyboard();
      resetHangman();
      updateWordDisplay();
      updateHint();
      updateCategoryBadge();
    }

    /* ============================================
       HANDLE GUESS (letter or space)
       ============================================ */
    function handleGuess(letter) {
      if (gameOver || guessedLetters.has(letter)) return;

      guessedLetters.add(letter);
      updateKeyboard(letter);

      if (currentWord.includes(letter)) {
        // Correct guess
        updateWordDisplay();
        checkWin();
      } else {
        // Wrong guess
        wrongGuesses++;
        showBodyPart(wrongGuesses - 1);
        checkLoss();
      }
    }

    /* ============================================
       PHYSICAL KEYBOARD SUPPORT
       ============================================ */
    function handlePhysicalKeyboard(e) {
      const key = e.key.toUpperCase();
      if (/^[A-Z ]$/.test(key)) {
        handleGuess(key);
      }
    }

    /* ============================================
       UPDATE WORD DISPLAY
       ============================================ */
    function updateWordDisplay() {
      wordDisplay.innerHTML = '';

      currentWord.split('').forEach(char => {
        const slot = document.createElement('div');
        slot.className = 'letter-slot';

        if (char === ' ') {
          slot.classList.add('space');
        } else if (guessedLetters.has(char)) {
          slot.classList.add('revealed');
          slot.textContent = char;
        }

        wordDisplay.appendChild(slot);
      });
    }

    /* ============================================
       UPDATE KEYBOARD BUTTONS
       ============================================ */
    function updateKeyboard(letter) {
      const keyBtn = keyboard.querySelector(`[data-letter="${letter}"]`);
      if (!keyBtn) return;

      if (currentWord.includes(letter)) {
        keyBtn.classList.add('correct');
      } else {
        keyBtn.classList.add('wrong');
      }
      keyBtn.disabled = true;
    }

    function resetKeyboard() {
      keyboard.querySelectorAll('.key').forEach(key => {
        key.className = 'key';
        key.disabled = false;
      });
    }

    /* ============================================
       HANGMAN SVG
       ============================================ */
    function showBodyPart(index) {
      if (index < bodyParts.length) {
        const part = document.getElementById(bodyParts[index]);
        if (part) part.classList.add('visible');
      }
    }

    function resetHangman() {
      bodyParts.forEach(partId => {
        const part = document.getElementById(partId);
        if (part) part.classList.remove('visible');
      });
    }

    /* ============================================
       HINT & CATEGORY
       ============================================ */
    function updateHint() {
      hintText.textContent = currentHint;
    }

    function updateCategoryBadge() {
      categoryBadge.textContent = currentCategory;
    }

    /* ============================================
       WIN / LOSS CHECKS
       ============================================ */
    function checkWin() {
      // All letters (except spaces) are guessed
      const wordLetters = currentWord.split('').filter(c => c !== ' ');
      const allGuessed = wordLetters.every(c => guessedLetters.has(c));

      if (allGuessed) {
        gameOver = true;
        score.wins++;
        score.streak++;
        saveScore();
        updateScoreDisplay();
        showMessage('You won! 🎉', 'won');
        triggerConfetti();
      }
    }

    function checkLoss() {
      if (wrongGuesses >= maxWrongGuesses) {
        gameOver = true;
        score.losses++;
        score.streak = 0;
        saveScore();
        updateScoreDisplay();
        showMessage(`Game over! The word was: ${currentWord}`, 'lost');
      }
    }

    /* ============================================
       MESSAGE DISPLAY
       ============================================ */
    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message visible ${type}`;
    }

    function hideMessage() {
      message.className = 'message';
    }

    /* ============================================
       SCORE (localStorage)
       ============================================ */
    function saveScore() {
      localStorage.setItem('hangmanScore', JSON.stringify(score));
    }

    function loadScore() {
      const saved = localStorage.getItem('hangmanScore');
      if (saved) {
        score = JSON.parse(saved);
        updateScoreDisplay();
      }
    }

    function updateScoreDisplay() {
      winsEl.textContent = score.wins;
      lossesEl.textContent = score.losses;
      streakEl.textContent = score.streak;
    }

    /* ============================================
       CONFETTI ANIMATION
       ============================================ */
    function triggerConfetti() {
      const colors = ['#f97316', '#22c55e', '#3b82f6', '#eab308', '#ec4899'];

      for (let i = 0; i < 50; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + '%';
        confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        confetti.style.width = (Math.random() * 8 + 6) + 'px';
        confetti.style.height = (Math.random() * 8 + 6) + 'px';
        confetti.style.animation = `confettiFall ${Math.random() * 2 + 1.5}s ease-out forwards`;
        confetti.style.animationDelay = Math.random() * 0.5 + 's';
        confettiContainer.appendChild(confetti);

        // Clean up after animation
        setTimeout(() => confetti.remove(), 4000);
      }
    }

    // Start the game
    init();
  </script>
</body>
</html>
